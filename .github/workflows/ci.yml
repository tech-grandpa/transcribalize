name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Gitleaks CLI
        run: |
          set -euo pipefail
          VERSION=8.30.0
          ARCHIVE="gitleaks_${VERSION}_linux_x64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSLo "$ARCHIVE" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${ARCHIVE}"
          echo "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e  ${ARCHIVE}" \
            | sha256sum --check --strict
          tar -xzf "$ARCHIVE" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Scan source and history for secrets
        run: gitleaks git --no-banner --redact .

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Lint with Ruff
        run: |
          python -m pip install --disable-pip-version-check ruff==0.15.10
          ruff check .

      - name: Install system test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Run API tests
        run: |
          python -m pip install --upgrade pip
          pip install -r transcriber/requirements-test.txt
          pytest -q transcriber/tests

      - name: Validate Docker Compose configuration
        working-directory: transcriber
        run: docker compose config -q

      - name: Check Dockerfile with BuildKit
        working-directory: transcriber
        run: docker buildx build --check .
